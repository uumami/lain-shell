[package]
name = "terminal-core"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
lain-types = { path = "../lain-types" }
alacritty_terminal = "0.24"
portable-pty = "0.8"
# Not used directly: forces rustix's `std` feature on. alacritty_terminal's
# tty/unix.rs needs `From<Errno> for io::Error` (the rustix `std` feature); in
# this minimal graph nothing else enables it via feature unification, so the
# build fails without this. (The spike's wgpu/winit deps enabled it incidentally.)
rustix = { version = "0.38", features = ["std"] }
cosmic-text = "0.12"

# GPU backend: glyphon 0.6 pins wgpu 22 and re-exports cosmic-text 0.12 (the same
# version this crate already depends on), so the text-layout type is shared, not
# duplicated. winit 0.30 + wgpu 22 + softbuffer 0.4 all share raw-window-handle 0.6.
wgpu = "22"
glyphon = "0.6"
winit = "0.30"
softbuffer = "0.4"
pollster = "0.3"

[[bin]]
name = "bebop"
path = "src/bin/bebop.rs"
